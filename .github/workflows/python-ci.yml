name: Python CI

on:
  push:
    paths:
      - ".github/workflows/python-ci.yml"
      - "**/*.py"
      - "pyproject.toml"
      - "setup.cfg"
      - "setup.py"
      - "requirements*.txt"
      - "poetry.lock"
      - "Pipfile"
      - "Pipfile.lock"
      - "Makefile"
      - "tox.ini"
      - ".python-version"
      - "src/**"
      - "tests/**"
  pull_request:
    branches:
      - "master"
    paths:
      - ".github/workflows/python-ci.yml"
      - "**/*.py"
      - "pyproject.toml"
      - "setup.cfg"
      - "setup.py"
      - "requirements*.txt"
      - "poetry.lock"
      - "Pipfile"
      - "Pipfile.lock"
      - "Makefile"
      - "tox.ini"
      - ".python-version"
      - "src/**"
      - "tests/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  python-versions:
    name: Python Versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.latest-versions }}
    steps:
      - name: Get Python Versions
        id: get-versions
        uses: lupaxa-actions-toolbox/get-language-versions@ba56d1892674d47d9b3a7e1a1819dda1c27f7dd3  # v0.1.4
        with:
          language: python
          min-version: "3.11"
          remove-patch-version: true

  python-ci:
    name: Lint & Test
    needs:
      - python-versions
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-python-makefile-ci.yml@master
    secrets: inherit
    with:
      python-versions: ${{ needs.python-versions.outputs.versions }}

  generate-workflow-summary:
    name: Generate Workflow Summary
    needs:
      - python-ci
    if: always()
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-workflow-summary.yml@master

  generate-workflow-notifications:
    name: Generate Workflow Notifications
    needs:
      - generate-workflow-summary
    if: always()
    uses: the-lupaxa-project/workflows/.github/workflows/reusable-workflow-notifier.yml@master
    with:
      notify_on_results: "failure,timed_out"
    secrets:
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
